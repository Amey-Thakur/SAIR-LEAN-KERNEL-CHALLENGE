## Name: ci.yml
## Purpose: Gate the checker on the two things that cannot be argued about.
## Description: The suite is half acceptances and half refusals, because a
##   checker that only ever accepts passes every acceptance test perfectly. The
##   second job re-runs the harness on the fixtures and asserts the exit codes
##   directly, since the exit code is the only thing the arena reads and a test
##   that calls the function is not the same as a process that returns 0. No
##   install step: the checker is standard library only by design, and this job
##   is where that stays true. Third-party actions are pinned to commit SHAs.
## Tech Stack: GitHub Actions, Python
## License: CC BY 4.0
## Authors: Amey Thakur (https://github.com/Amey-Thakur)
## Date: 2026-08-29

name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  tests:
    name: The suite, on the oldest supported Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest, and nothing else
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run the suite
        run: python -m pytest tests -q

  exit-codes:
    name: The three exit codes, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Written out here rather than imported from the tests, so that a change
      # to the fixtures cannot quietly change what this job is asserting.
      - name: Build the fixtures
        run: |
          cat > /tmp/good.ndjson <<'EOF'
          {"meta":{"kind":"export","version":"3.1.0","producer":"ci"}}
          {"in":1,"str":{"pre":0,"str":"Bool"}}
          {"il":1,"succ":0}
          {"ie":0,"sort":1}
          {"axiom":{"name":1,"levelParams":[],"type":0}}
          EOF
          cp /tmp/good.ndjson /tmp/bad.ndjson
          cat >> /tmp/bad.ndjson <<'EOF'
          {"in":2,"str":{"pre":0,"str":"bad"}}
          {"ie":1,"const":{"name":1,"us":[]}}
          {"def":{"name":2,"levelParams":[],"type":1,"value":0}}
          EOF
          cp /tmp/good.ndjson /tmp/unknown.ndjson
          echo '{"someFutureItem":{"name":1}}' >> /tmp/unknown.ndjson

      - name: A well typed export exits 0
        run: |
          python -m src.harness.check_export /tmp/good.ndjson
          test $? -eq 0

      - name: An ill typed export exits 1
        run: |
          set +e
          python -m src.harness.check_export /tmp/bad.ndjson
          test $? -eq 1

      - name: An unreadable item exits 2, never 0
        run: |
          set +e
          IN=/tmp/unknown.ndjson python -m src.harness.check_export
          test $? -eq 2

      # These two are the arena's own exports, kept verbatim. Both are proofs of
      # False, and both are the kind a checker accepts by believing what the
      # export said about its own inductive block rather than deriving it.
      - name: The arena's fabricated recursor exits 1
        run: |
          set +e
          python -m src.harness.check_export tests/fixtures/extra-rec.ndjson
          test $? -eq 1

      - name: The arena's large elimination attack exits 1
        run: |
          set +e
          python -m src.harness.check_export tests/fixtures/large-elim-param.ndjson
          test $? -eq 1
