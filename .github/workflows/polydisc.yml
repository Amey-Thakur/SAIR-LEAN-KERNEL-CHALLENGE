name: polydisc

## Measures a polydisc candidate against the shipped starter, in the real
## problem package, on the same runner, in the same run.
##
## polydisc had no workflow until 17 October 2026 and its live entry is the
## specification itself, so nothing was known about where its kernel work
## goes. Two cost models fit the static count and they call for opposite
## fixes: `costmodel.py` puts 55% of the OPERATIONS in the coefficient setup
## and 95% of the BIT-WORK in the subresultant loop. Whichever the judge
## charges for decides what is worth building, and only a measurement can
## say. This is that measurement.
##
## The package uses core Lean with no Mathlib dependency, so a run is a Lean
## download and a build.
##
## Authors: Amey Thakur (https://github.com/Amey-Thakur)

on:
  push:
    branches: [main]
    paths:
      - "stage2/polydisc/**"
      - "stage2/timecases.py"
      - "stage2/report_times.py"
      - ".github/workflows/polydisc.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "which measurement to run"
        type: choice
        default: both
        options: [both, wall, instructions]
      scope:
        description: "which benchmarks the instrument runs"
        type: choice
        default: judged
        options: [judged, chains, round2, all]

permissions:
  contents: read

env:
  UPSTREAM_SHA: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  measure:
    name: candidate against the shipped starter
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.mode == 'both' || inputs.mode == 'wall'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the challenge at the pinned commit
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/SAIRcompetition/lean-kernel-challenge.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout FETCH_HEAD

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The transcription is checked against a discriminant computed by a
      # different route before anything is built, so a disagreement here is a
      # failure of the model rather than of the proof.
      - name: Re-check the transcription against an independent discriminant
        run: python stage2/polydisc/model.py

      - name: Where the work goes, under both cost models
        continue-on-error: true
        run: python stage2/polydisc/costmodel.py

      # The starter is the live entry, so this is the number to beat.
      - name: Build and time the shipped starter
        working-directory: upstream/problems/polydisc
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../../../starter-build.log
          python ../../../stage2/timecases.py \
            --cases ../../../stage2/polydisc/cases.json \
            --label starter --out ../../../starter-times.json \
            --timeout 600

      # Every lemma name in a proof written without a toolchain is a guess.
      # This compiles the guesses alone, so a wrong name is reported by itself
      # rather than buried in the real proof's errors, and `#check` prints the
      # statement so the direction of each rewrite is known before it is used.
      - name: Probe which core Int lemmas exist
        continue-on-error: true
        working-directory: upstream/problems/polydisc
        run: |
          lake build Spec
          cp ../../../stage2/polydisc/Probe.lean .
          lake env lean Probe.lean 2>&1 | tee ../../../probe.log || true
          echo "--- names that did not resolve ---"
          grep -E "[Uu]nknown (constant|identifier)" ../../../probe.log || echo "(all resolved)"

      - name: Place the candidate in the real problem package
        run: |
          if diff -q stage2/polydisc/Submission.lean \
               upstream/problems/polydisc/Submission.lean >/dev/null 2>&1; then
            echo "candidate is byte-identical to the starter"
            echo "same=1" >> "$GITHUB_ENV"
          else
            cp stage2/polydisc/Submission.lean \
               upstream/problems/polydisc/Submission.lean
            wc -l upstream/problems/polydisc/Submission.lean
          fi

      - name: Build the candidate, which is where the proof is checked
        id: build
        if: env.same != '1'
        continue-on-error: true
        working-directory: upstream/problems/polydisc
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../../../candidate-build.log

      # A proof that closes on a forbidden axiom is a rejection, not a win.
      - name: Check the axioms are permitted
        if: steps.build.outcome == 'success'
        working-directory: upstream/problems/polydisc
        run: |
          printf 'import Submission\n#print axioms Submission.impl_correct\n' > Axioms.lean
          lake env lean Axioms.lean 2>&1 | tee ../../../axioms.txt
          if grep -qiE "unknown|error" ../../../axioms.txt; then
            echo "impl_correct missing or errored"; cat ../../../axioms.txt; exit 1
          fi
          if ! grep -q "axioms" ../../../axioms.txt; then
            echo "no axiom line reported"; exit 1
          fi
          if grep -qiE "sorryAx|native" ../../../axioms.txt; then
            echo "FORBIDDEN AXIOM"; exit 1
          fi

      - name: Time the candidate on the same cases
        if: steps.build.outcome == 'success'
        working-directory: upstream/problems/polydisc
        run: |
          python ../../../stage2/timecases.py \
            --cases ../../../stage2/polydisc/cases.json \
            --label candidate --out ../../../candidate-times.json \
            --timeout 600

      # One case per process cannot resolve this change. Lean start-up is
      # 0.95 s of every figure above and the largest judged case is 1.1 s of
      # work, while two cases at the same difficulty varied by 0.5 s between
      # themselves. A saving of a tenth is well inside that.
      #
      # So the hardest difficulty is timed in bulk: eight distinct inputs in
      # one process, which pays start-up once against about nine seconds of
      # work. The inputs are distinct so that nothing is served from the
      # kernel's cache. Starter and candidate are timed the same way, back to
      # back, on the same runner.
      - name: Time both in bulk at the hardest difficulty
        if: always()
        working-directory: upstream/problems/polydisc
        run: |
          python ../../../stage2/polydisc/bulk.py --emit > Bulk.lean
          wc -l Bulk.lean
          echo "--- whatever is built now (the candidate, if it built) ---"
          /usr/bin/time -f 'FIRST bulk %e s' lake env lean Bulk.lean \
            > ../../../bulk-first.txt 2>&1 || true
          tail -2 ../../../bulk-first.txt
          echo "--- restoring the shipped starter and rebuilding ---"
          git -C ../.. checkout -- problems/polydisc/Submission.lean
          lake build 2>&1 | tail -2
          /usr/bin/time -f 'STARTER bulk %e s' lake env lean Bulk.lean \
            > ../../../bulk-starter.txt 2>&1 || true
          tail -2 ../../../bulk-starter.txt
          echo "=== bulk result ==="
          grep -h "bulk .* s" ../../../bulk-first.txt ../../../bulk-starter.txt || true

      - name: Report
        if: always()
        run: |
          {
            echo "### polydisc"
            python stage2/report_times.py starter-times.json candidate-times.json 2>/dev/null \
              || python stage2/report_times.py starter-times.json 2>/dev/null \
              || echo "(no timings)"
            if [ -f axioms.txt ]; then echo ''; echo "axioms:"; cat axioms.txt; fi
            for f in starter-build.log candidate-build.log; do
              if [ -f "$f" ] && grep -qE "^error" "$f"; then
                echo ''; echo "$f errors:"; echo '```'
                grep -E "error" "$f" | head -30; echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polydisc-logs
          path: |
            starter-build.log
            candidate-build.log
            starter-times.json
            candidate-times.json
            axioms.txt
            probe.log
            bulk-first.txt
            bulk-starter.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The metric the leaderboard actually ranks, measured rather than modelled.
  #
  # `rules/evaluation.md` says it: "In three separate processes, count only the
  # target declaration's kernel check, which reduces `impl n` and compares it
  # with `v`", on a "Linux PMU host" with "kernel instruction counts". So the
  # ranked quantity is instructions retired by the KERNEL alone. Wall clock
  # measures the wrong thing twice over -- it carries 0.95 s of start-up and
  # the elaboration of a 24,000-figure literal, and it cannot resolve a tenth
  # of the work at the sizes that matter.
  #
  # A GitHub runner has no usable PMU, so `perf` cannot reproduce that counter.
  # Callgrind can: it counts guest instructions exactly, with no run-to-run
  # noise, which is the same quantity a PMU reports for user-space work. The
  # kernel is then separated from the elaborator by differencing against the
  # same file compiled with `debug.skipKernelTC`, which elaborates the
  # declaration and never hands it to the kernel.
  #
  # The instrument is checked before it is trusted: the sum of those
  # differences over the six judged sizes is compared with 10,322,617,420, the
  # published figure for this very file.
  # ---------------------------------------------------------------------------
  instrument:
    name: what the judge charges for, in instructions
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.mode == 'both' || inputs.mode == 'instructions'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the challenge at the pinned commit
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/SAIRcompetition/lean-kernel-challenge.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout FETCH_HEAD

      - name: Install elan and valgrind
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      - name: Is a hardware counter available on this runner at all
        continue-on-error: true
        run: |
          cat /proc/sys/kernel/perf_event_paranoid || true
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic \
            || true
          perf stat -e instructions /bin/true 2>&1 | tail -8 || true

      - name: Build the shipped starter, which is the ranked entry
        working-directory: upstream/problems/polydisc
        run: |
          set -o pipefail
          lake build 2>&1 | tail -3

      - name: Emit the benchmarks
        run: |
          python stage2/polydisc/instrument.py \
            --emit upstream/problems/polydisc/bench

      # One process per file, one file per measurement, exactly as the judge
      # does it. A deadline guards the loop so that an unaccelerated primitive
      # in one probe cannot cost the whole table.
      - name: Count instructions, starter
        working-directory: upstream/problems/polydisc
        env:
          SCOPE: ${{ inputs.scope || 'judged' }}
        run: |
          cp ../../../stage2/polydisc/runbench.sh .
          bash runbench.sh bench 3300 "$SCOPE"
          cp -r bench ../../../bench-starter

      - name: Report, starter
        if: always()
        run: |
          python stage2/polydisc/instrument.py --report bench-starter \
            | tee instrument-starter.txt

      # Whatever is in Candidate.lean, built in the real package so the proof
      # is checked, and measured on the six judged sizes against the figures
      # above. A candidate is never copied over `Submission.lean` until it has
      # been through this.
      - name: Place the candidate and rebuild
        id: candbuild
        continue-on-error: true
        working-directory: upstream/problems/polydisc
        run: |
          set -o pipefail
          if [ -f ../../../stage2/polydisc/Candidate.lean ]; then
            cp ../../../stage2/polydisc/Candidate.lean Submission.lean
          else
            cp ../../../stage2/polydisc/Submission.lean .
          fi
          lake build 2>&1 | tee ../../../candidate2-build.log | tail -30

      - name: Check the candidate's axioms
        if: steps.candbuild.outcome == 'success'
        working-directory: upstream/problems/polydisc
        run: |
          printf 'import Submission\n#print axioms Submission.impl_correct\n' \
            > Axioms2.lean
          lake env lean Axioms2.lean 2>&1 | tee ../../../axioms2.txt
          if grep -qiE "unknown|error|sorryAx|native" ../../../axioms2.txt; then
            echo "FORBIDDEN OR MISSING"; exit 1
          fi

      # The same six sizes against the candidate. The candidate is the entry
      # that measured 3% faster on the clock; if the instrument cannot see
      # that, it cannot see anything smaller either.
      - name: Count instructions, candidate, judged sizes only
        if: steps.candbuild.outcome == 'success'
        working-directory: upstream/problems/polydisc
        run: |
          rm -rf benchc && cp -r bench benchc
          bash runbench.sh benchc 1500 judged
          cp -r benchc ../../../bench-candidate

      - name: Report, candidate
        if: always()
        run: |
          python stage2/polydisc/instrument.py --report bench-candidate \
            | tee instrument-candidate.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### polydisc, kernel instruction counts"
            echo '```'
            cat instrument-starter.txt 2>/dev/null || true
            echo '```'
            echo '```'
            cat instrument-candidate.txt 2>/dev/null || true
            echo '```'
            if [ -f candidate2-build.log ] \
               && grep -q "^error" candidate2-build.log; then
              echo ''; echo "the candidate did not build:"; echo '```'
              grep -E "error" candidate2-build.log | head -40; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polydisc-instructions
          path: |
            instrument-starter.txt
            instrument-candidate.txt
            candidate2-build.log
            axioms2.txt
            bench-starter/*.out
            bench-candidate/*.out
            bench-starter/manifest.json
          if-no-files-found: warn
