name: fib and primecount

## Both problems import Mathlib, so a run here is slower than the core-only
## ones and the package's own setup.py fetches the pinned dependency cache.
##
## The first thing this measures is the starter, not a candidate. Mathlib's
## Nat.fastFib is already fast doubling, and the primecount starter already
## carries a correct proof, so whether either needs replacing is a question
## with an answer rather than an assumption. A candidate is only built when one
## exists; until then the run reports what the shipped code costs.
##
## Authors: Amey Thakur (https://github.com/Amey-Thakur)

on:
  push:
    branches: [main]
    paths:
      - "stage2/fib/**"
      - "stage2/primecount/**"
      - "stage2/mertens/**"
      - "stage2/cases.py"
      - "stage2/timecases.py"
      - "stage2/report_times.py"
      - ".github/workflows/mathlib-problems.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  measure:
    name: ${{ matrix.problem }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        problem: [fib, primecount, mertens]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the challenge at the pinned commit
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/SAIRcompetition/lean-kernel-challenge.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout FETCH_HEAD

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Expected answers, computed by a method unlike the submission's
        run: python stage2/cases.py --problem ${{ matrix.problem }}

      - name: Prepare the pinned Mathlib dependencies
        working-directory: upstream/problems/${{ matrix.problem }}
        run: python setup.py

      # The baseline is whatever the challenge ships. Everything a candidate
      # claims is measured against this number on this runner, so a slow runner
      # shows up in both rather than as an apparent win.
      - name: Build the starter
        id: starter
        working-directory: upstream/problems/${{ matrix.problem }}
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../../../starter-build.log

      - name: Time the kernel reducing the starter at the judged sizes
        if: steps.starter.outcome == 'success'
        working-directory: upstream/problems/${{ matrix.problem }}
        run: |
          python ../../../stage2/timecases.py \
            --cases ../../../stage2/${{ matrix.problem }}/cases.json \
            --label starter --out ../../../starter-times.json

      # Every lemma name in a proof written without a toolchain is a guess.
      # Compiling the guesses on their own reports a wrong name by itself
      # rather than buried under the real proof's errors.
      - name: Probe which lemmas exist, if there is a probe
        continue-on-error: true
        working-directory: upstream/problems/${{ matrix.problem }}
        run: |
          probe=../../../stage2/${{ matrix.problem }}/Probe.lean
          if [ ! -f "$probe" ]; then echo "no probe"; exit 0; fi
          cp "$probe" .
          lake env lean Probe.lean 2>&1 | tee ../../../probe.log || true
          echo "--- names that did not resolve ---"
          grep -E "[Uu]nknown (constant|identifier)" ../../../probe.log || echo "(none)"

      # A candidate is optional: until one is written the run is a measurement
      # of the shipped code, which is the point.
      - name: Build and time the candidate, if there is one
        id: candidate
        continue-on-error: true
        working-directory: upstream/problems/${{ matrix.problem }}
        run: |
          src=../../../stage2/${{ matrix.problem }}/Submission.lean
          if [ ! -f "$src" ]; then
            echo "no candidate for ${{ matrix.problem }} yet"; exit 0
          fi
          if diff -q "$src" Submission.lean >/dev/null 2>&1; then
            echo "candidate is byte-identical to the starter; nothing to compare"
            exit 0
          fi
          cp "$src" Submission.lean
          set -o pipefail
          lake build 2>&1 | tee ../../../candidate-build.log
          printf 'import Submission\n#print axioms Submission.impl_correct\n' > Axioms.lean
          lake env lean Axioms.lean 2>&1 | tee ../../../axioms.txt
          if grep -qiE "unknown|error" ../../../axioms.txt; then
            echo "impl_correct missing or errored"; exit 1
          fi
          if grep -qiE "sorryAx|native" ../../../axioms.txt; then
            echo "FORBIDDEN AXIOM"; exit 1
          fi
          python ../../../stage2/timecases.py \
            --cases ../../../stage2/${{ matrix.problem }}/cases.json \
            --label candidate --out ../../../candidate-times.json

      # One case per process, against a 31,348-digit expected literal, cannot
      # resolve a change in `fib`: start-up is 1.74 s of every figure and the
      # literal is parsed identically by every candidate. This step decomposes
      # that figure and then times each design in bulk against a right-hand
      # side that costs nothing to read. It restores the shipped starter when
      # it finishes, so the steps after it see what they saw before.
      - name: fib — measure each design where the computation is visible
        if: matrix.problem == 'fib'
        continue-on-error: true
        working-directory: upstream/problems/fib
        run: bash ../../../stage2/fib/measure.sh ../../..

      # The kernel's own cost, not the clock's. A Mathlib package pays about
      # 1.74 s of start-up before it does any work, so a whole-process figure
      # cannot resolve a change of 1.4x in a computation that takes a fraction
      # of a second. profkernel.py reads Lean's profiler instead, whose
      # cumulative "type checking" phase is addDecl, which is the boundary the
      # rules define as counted. The previous entry and the candidate are
      # built and measured back to back on the same runner.
      - name: Kernel cost, previous entry against the candidate
        if: always()
        continue-on-error: true
        working-directory: upstream/problems/${{ matrix.problem }}
        run: |
          case "${{ matrix.problem }}" in
            primecount) PREV=SubmissionSqrt.lean ;;
            mertens) PREV=SubmissionPrev.lean ;;
            *) PREV="" ;;
          esac
          SRC=../../../stage2/${{ matrix.problem }}
          KERN=../../../${{ matrix.problem }}-kernel.tsv
          if [ -z "$PREV" ] || [ ! -f "$SRC/$PREV" ]; then
            echo "no previous entry recorded for ${{ matrix.problem }}"
            exit 0
          fi
          for which in prev cand; do
            if [ "$which" = prev ]; then cp "$SRC/$PREV" Submission.lean; fi
            if [ "$which" = cand ]; then cp "$SRC/Submission.lean" Submission.lean; fi
            if lake build > /dev/null 2>&1; then
              python ../../../stage2/profkernel.py --cases "$SRC/cases.json" --label "$which" --reps 2 --min-n 50 --out "$KERN"
            else
              echo "  $which: BUILD FAILED"
            fi
          done
          echo "=== kernel ms, the judged boundary ==="
          cat "$KERN" || true

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ matrix.problem }}"
            if [ -f fib-kernel.tsv ]; then
              echo ''
              echo "fib kernel time, which is the judged boundary:"
              echo '```'; cat fib-kernel.tsv; echo '```'
            fi
            if [ -f fib-measure.tsv ]; then
              echo ''; echo "fib whole-process wall-clock, as a cross-check:"
              echo '```'; cat fib-measure.tsv; echo '```'
            fi
            python stage2/report_times.py starter-times.json candidate-times.json 2>/dev/null \
              || echo "(no timings)"
            if [ -f axioms.txt ]; then echo ''; echo "axioms:"; cat axioms.txt; fi
            for f in starter-build.log candidate-build.log; do
              if [ -f "$f" ] && grep -qE "^error" "$f"; then
                echo ''; echo "$f errors:"; echo '```'
                grep -E "^error" "$f" | head -20; echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.problem }}-logs
          path: |
            starter-build.log
            candidate-build.log
            starter-times.json
            candidate-times.json
            axioms.txt
            *-kernel.tsv
            probe.log
            fib-measure.tsv
            fib-kernel.tsv
            fib-cases-CandidateRaw.json
            fib-logs/
          if-no-files-found: warn
